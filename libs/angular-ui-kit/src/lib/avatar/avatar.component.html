<div 
  [class]="avatarClasses()"
  [attr.role]="decorative() ? null : 'img'"
  [attr.aria-label]="decorative() ? null : ariaLabel()"
  [attr.aria-hidden]="decorative() ? 'true' : null"
>
  @if (showImage()) {
    <!-- `loading` before `src`: attribute bindings run in template order, after
         every property binding, so `[attr.src]` keeps the source behind
         `loading` (G-40; an engine may start the request when src is set). -->
    <img
      [alt]="alt() || name() || 'Avatar'"
      class="lc-avatar__image"
      [attr.width]="imagePx()"
      [attr.height]="imagePx()"
      [attr.loading]="loading() === 'lazy' ? 'lazy' : null"
      [attr.src]="src()!"
      (error)="onImageError()"
    />
  } @else if (showPerson()) {
    <!-- The kit's user glyph (ICON_USER_SOLID) inline: no icon registration, final in prerendered HTML. -->
    <svg class="lc-avatar__person" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path
        fill-rule="evenodd"
        clip-rule="evenodd"
        d="M7.5 6a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM3.751 20.105a8.25 8.25 0 0116.498 0 .75.75 0 01-.437.695A18.683 18.683 0 0112 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 01-.437-.695z"
      />
    </svg>
  } @else {
    <span class="lc-avatar__initials">{{ initials() }}</span>
  }

  @if (status()) {
    <span 
      class="lc-avatar__status lc-avatar__status--{{ status() }}"
      [attr.aria-label]="status() + ' status'"
    ></span>
  }
</div>
