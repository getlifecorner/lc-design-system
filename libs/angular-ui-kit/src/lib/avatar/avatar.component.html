<div 
  [class]="avatarClasses()"
  [attr.role]="decorative() ? null : 'img'"
  [attr.aria-label]="decorative() ? null : ariaLabel()"
  [attr.aria-hidden]="decorative() ? 'true' : null"
>
  @if (showImage()) {
    <!-- `loading` before `src`: attribute bindings run in template order, after
         every property binding, so `[attr.src]` keeps the source behind
         `loading` (G-40; an engine may start the request when src is set). -->
    <img
      [alt]="alt() || name() || 'Avatar'"
      class="lc-avatar__image"
      [attr.width]="imagePx()"
      [attr.height]="imagePx()"
      [attr.loading]="loading() === 'lazy' ? 'lazy' : null"
      [attr.src]="src()!"
      (error)="onImageError()"
    />
  } @else {
    <span class="lc-avatar__initials">{{ initials() }}</span>
  }

  @if (status()) {
    <span 
      class="lc-avatar__status lc-avatar__status--{{ status() }}"
      [attr.aria-label]="status() + ' status'"
    ></span>
  }
</div>
