@if (colorMode() === 'dark') {
  <img class="lc-character__img" [attr.loading]="loading() === 'lazy' ? 'lazy' : null" [attr.src]="darkSrc()" alt="" aria-hidden="true" width="100" height="100" decoding="async" fetchpriority="low" />
} @else {
  <img class="lc-character__img lc-character__img--light" [attr.loading]="loading() === 'lazy' ? 'lazy' : null" [attr.src]="lightSrc()" alt="" aria-hidden="true" width="100" height="100" decoding="async" fetchpriority="low" />
  <img class="lc-character__img lc-character__img--dark" [attr.loading]="loading() === 'lazy' ? 'lazy' : null" [attr.src]="darkSrc()" alt="" aria-hidden="true" width="100" height="100" decoding="async" fetchpriority="low" />
}
