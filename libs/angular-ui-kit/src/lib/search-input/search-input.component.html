<div [class]="wrapperClasses()">
  <lc-icon name="magnifying-glass" class="search-input__icon" [decorative]="true"></lc-icon>
  <input
    #searchInputEl
    type="search"
    class="search-input__field"
    [id]="inputId()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [value]="value()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    autocomplete="off"
    [attr.aria-label]="ariaLabelledBy() ? null : ariaLabel() || 'Search'"
    [attr.aria-labelledby]="ariaLabelledBy() || null"
    [attr.role]="inputRole()"
    [attr.aria-expanded]="ariaExpanded() === null ? null : ariaExpanded() ? 'true' : 'false'"
    [attr.aria-controls]="ariaControls() || null"
    [attr.aria-activedescendant]="ariaActiveDescendant() || null"
    [attr.aria-autocomplete]="ariaAutocomplete()"
    [attr.aria-haspopup]="ariaHasPopup()"
    [attr.aria-describedby]="description() ? descriptionId() : null"
  />
  @if (value()) {
    <button
      type="button"
      class="search-input__clear"
      (click)="clear()"
      [attr.aria-label]="clearAriaLabel()"
      [disabled]="disabled()"
    >
      <lc-icon name="x-mark" class="search-input__clear-icon" [decorative]="true"></lc-icon>
    </button>
  }
  @if (description()) {
    <span class="search-input__description" [id]="descriptionId()">{{ description() }}</span>
  }
</div>
