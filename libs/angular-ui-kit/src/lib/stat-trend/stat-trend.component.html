<div class="lc-stat-trend">
  <div class="lc-stat-trend__header">
    @if (label()) {
      <span class="lc-stat-trend__label">{{ label() }}</span>
    }
    @if (icon()) {
      <lc-icon [name]="icon()" size="sm" class="lc-stat-trend__header-icon" [decorative]="true" />
    }
  </div>
  <!-- Request 031 (WCAG 2.5.3): a space before the row, the pill and the sparkline keeps the
       text "Label Value +3,1 %"; in a flex container it gets no box and renders nothing. -->
  &ngsp;
  <div class="lc-stat-trend__row">
    <span class="lc-stat-trend__value">{{ value() }}</span>

    @if (change()) {
      &ngsp;<span class="lc-stat-trend__change" [class]="trendColorClass()">
        <span class="lc-stat-trend__icon" [attr.aria-hidden]="sentiment() ? 'true' : null">{{ trendIcon() }}</span>
        <!-- The hidden text follows the change without a space ("+3,1 %, gestiegen", review r1 N2);
             without a sentiment the text node stays " +3.1% " as before 3.14. -->
        @if (sentiment()) {
          {{ change() }}<span class="lc-stat-trend__sr-only">{{ srText() }}</span>
        } @else {
          {{ change() }}
        }
      </span>
    }
  </div>

  @if (hasSparkline()) {
    &ngsp;<lc-sparkline
      [data]="sparklineData()"
      [color]="resolvedSparklineColor()"
      [width]="120"
      [height]="28"
      [filled]="true"
      [strokeWidth]="1.5"
    ></lc-sparkline>
  }
</div>
