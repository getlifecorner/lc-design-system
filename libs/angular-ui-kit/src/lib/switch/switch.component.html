<div
  class="lc-switch-wrapper"
  [class.lc-switch-wrapper--label-left]="labelPosition() === 'left'"
  [class.lc-switch-wrapper--label-right]="labelPosition() === 'right'"
  [class.lc-switch-wrapper--help]="!!helpTextId()"
>
  @if (labelPosition() === 'left') {
    @if (helpTextId(); as helpId) {
      <!-- Label and help text in one column; the label's ::after covers it, so a tap on the help toggles too. -->
      <div class="lc-switch-text lc-switch-text--{{ size() }}">
        @if (label()) {
          <label [for]="switchId" class="lc-switch-label">{{ label() }}</label>
        }
        <div [id]="helpId" class="lc-switch-help">{{ helpText() }}</div>
      </div>
    } @else if (label()) {
      <label [for]="switchId" class="lc-switch-label">{{ label() }}</label>
    }
  }

  <!-- Native button: labelable (label for/id works), focusable and Space/Enter toggle it without custom key handling -->
  <button
    type="button"
    [id]="switchId"
    [class]="switchClasses()"
    role="switch"
    [attr.aria-checked]="checkedState()"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-describedby]="helpTextId()"
    [attr.aria-required]="required() || null"
    [attr.aria-busy]="loading() || null"
    [attr.aria-disabled]="loading() && !isDisabled() ? true : null"
    [disabled]="isDisabled()"
    (click)="onClick()"
  >
    <span class="lc-switch-track">
      <span class="lc-switch-thumb">
        @if (loading()) {
          <span class="lc-switch-loading-spinner"></span>
        }
      </span>
    </span>
  </button>

  @if (labelPosition() === 'right') {
    @if (helpTextId(); as helpId) {
      <div class="lc-switch-text lc-switch-text--{{ size() }}">
        @if (label()) {
          <label [for]="switchId" class="lc-switch-label">{{ label() }}</label>
        }
        <div [id]="helpId" class="lc-switch-help">{{ helpText() }}</div>
      </div>
    } @else if (label()) {
      <label [for]="switchId" class="lc-switch-label">{{ label() }}</label>
    }
  }
</div>
