<div class="lc-textarea-wrapper">
  @if (label()) {
    <!-- No whitespace before the *: the gap is its margin, and it never wraps onto a line alone -->
    <label [for]="textareaId" class="lc-textarea-label">
      {{ label() }}@if (required() && requiredIndicator()) {<span class="lc-textarea-required-indicator" aria-hidden="true">*</span>}
    </label>
  }

  <div class="lc-textarea-input-wrapper">
    <textarea
      #textarea
      [id]="textareaId"
      [class]="textareaClasses()"
      [value]="renderedValue()"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()"
      [readonly]="readonly()"
      [required]="required()"
      [attr.name]="name() ?? null"
      [attr.rows]="autoResize() ? null : rows()"
      [attr.maxlength]="maxLength() ?? null"
      [attr.aria-label]="ariaLabel() || null"
      [attr.aria-required]="required() || null"
      [attr.aria-invalid]="error() || null"
      [attr.aria-describedby]="describedBy()"
      (input)="onInput(getInputValue($event))"
      (blur)="onBlur()"
    ></textarea>
  </div>

  <div class="lc-textarea-footer">
    <div class="lc-textarea-messages">
      @if (showsError()) {
        <span [id]="errorId" class="lc-textarea-error-message" [attr.role]="announceError() ? 'alert' : null">{{ errorMessage() }}</span>
      } @else if (showsHelper()) {
        <span [id]="helperId" class="lc-textarea-helper-text">{{ helperText() }}</span>
      }
    </div>

    @if (showCharacterCount()) {
      <span
        class="lc-textarea-character-count"
        [class.lc-textarea-character-count--over-limit]="isOverLimit()"
        aria-live="polite"
      >
        {{ characterCountText() }}
      </span>
    }
  </div>
</div>
